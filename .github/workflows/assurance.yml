name: Project assurance

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      tier: ${{ steps.profile.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: profile
        run: |
          tier=$(python3 scripts/ci/assurance.py tier)
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
      - name: Install verified scanners
        run: bash scripts/ci/install_assurance_tools.sh
      - name: Scan committed files and history
        run: python3 scripts/ci/assurance.py scan
      - name: Retain dependency inventory
        if: steps.profile.outputs.tier != 'low'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: tmp/assurance/sbom.cdx.json
          if-no-files-found: error
      - name: Verify accepted behavior
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head=$(git rev-parse HEAD)
          if [[ -n "$PR_BASE" ]]; then
            base=$(git merge-base "$PR_BASE" "$head")
          elif [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base="$BEFORE"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            base=$(git rev-parse --verify "$head^" 2>/dev/null || git hash-object -w -t tree /dev/null)
          elif [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]] && git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
            base=$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" "$head")
          else
            base=$(git hash-object -w -t tree /dev/null)
          fi
          python3 tools/push_gate/session_delivery.py push "$base" "$head" --snapshot .
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then make check; fi

  critical-readiness:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && needs.assurance.outputs.tier == 'critical'
    needs: assurance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate recovery and release approval settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/assurance.py recovery
          gh api "repos/$GITHUB_REPOSITORY/environments/critical-release" |
            jq -e '(.can_admins_bypass == false) and any(.protection_rules[]; .type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length > 0))'

  attest-source:
    needs: [assurance, critical-readiness]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.assurance.result == 'success' &&
      (needs.assurance.outputs.tier == 'high' ||
      (needs.assurance.outputs.tier == 'critical' && needs.critical-readiness.result == 'success'))
    runs-on: ubuntu-24.04
    environment: ${{ needs.assurance.outputs.tier == 'critical' && 'critical-release' || 'assurance-release' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package reviewed source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/source.tar.gz
          create-storage-record: false
      - name: Verify provenance and builder identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$RUNNER_TEMP/source.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/assurance.yml" \
            --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - name: Retain verified archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attested-source
          path: ${{ runner.temp }}/source.tar.gz
          if-no-files-found: error
